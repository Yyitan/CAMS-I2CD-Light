model:
  model_name: CAMS
  prompt_template: ["a photo of x x", "a photo of x", "a photo of x"]
  ctx_init: ["a photo of ", "a photo of ", "a photo of "]
  clip_model: "./lyt/czsl/CLIP-main/ViT-L-14.pt"
  num_units: 32
  m_layers: 9
  adapter_dim: 64
  use_i2cd_light: false
  use_prompt_i2cd: true
  prompt_i2cd_hidden_dim: 512
  prompt_i2cd_dropout: 0.1
  prompt_i2cd_mix_init: 0.05

train:
  dataset: ut-zappos
  step_size: 1
  gamma: 0.5
  lr: 0.00025
  train_batch_size: 64
  epochs: 15
  context_length: 8
  seed: 0
  val_metric: AUC
  save_final_model: True
  save_path: output/utzappos_prompt_i2cd_v2a
  att_loss_weight: 0.5
  obj_loss_weight: 0.5
  com_loss_weight: 1
  glb_loss_weight: 1
  lambda_prompt_i2cd_compose: 0.02
  lambda_prompt_i2cd_dis: 0.02
  lambda_prompt_i2cd_re: 0.01
  lambda_prompt_i2cd_cycle: 0.01

test:
  open_world: true
  eval_batch_size: 64
  feasibility: feasibilities/feasibility_zp.pt
  threshold: 0.4705232256
  threshold_trials: 50
  beta: 0.65
  load_model: output/utzappos_prompt_i2cd_v2a/final_model.pt
